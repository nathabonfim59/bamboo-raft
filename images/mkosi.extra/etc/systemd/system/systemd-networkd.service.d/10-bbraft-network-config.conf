# Managed by bamboo-raft infra (images/mkosi.extra).
#
# A real failure of bbraft-network-config (unreadable command line, an
# unwritable /run/systemd/network, a failed atomic replace) must not leave
# systemd-networkd free to start with the image's DHCP unit, which in TAP mode
# would wait for a server the node never chose. Requires= plus After= makes a
# failed generator block networkd: networkd is not started and cannot fall back
# to DHCP, the failed generator unit is visible in the journal, and the guest
# agent keeps serving over vsock so the sandbox remains observable. Malformed
# kernel parameters are different: the generator installs its explicit
# no-address unit and exits successfully, so networkd starts and configures no
# address, DHCP or RA of its own (the kernel may already have applied a valid
# ip= before networkd starts).
[Unit]
Requires=bbraft-network-config.service
After=bbraft-network-config.service
