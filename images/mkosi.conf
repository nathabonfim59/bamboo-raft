# Pinned mkosi configuration for the bamboo-raft guest image.
#
# Build with `make -C images image`, not by invoking mkosi directly: build.sh
# pins mkosi 27.1 from a sha256-verified source tarball, installs the pinned Go
# and Node toolchains, turns the directory output into root.qcow2 and writes
# manifest.json. See docs/guest-image.md.
#
# Format=directory keeps the build unprivileged-capable and avoids partitioning
# or a bootloader: the node direct-boots kernel+initrd with root=/dev/vda, and
# root.qcow2 is a whole-disk ext4 filesystem (no partition table).

[Distribution]
Distribution=ubuntu
Release=noble
Architecture=x86-64
# Snapshot pinned in images/pins.sh (UBUNTU_SNAPSHOT); build.sh asserts they
# agree. Ubuntu 24.04's apt enables snapshot.ubuntu.com automatically.
Snapshot=20261108T182718Z
# podman, uidmap, slirp4netns and fuse-overlayfs live in universe.
Repositories=universe

[Output]
Format=directory
Output=bbraft-ubuntu-24.04
ManifestFormat=json

[Build]
# The image build does not mount the host source tree into the sandbox. The
# mkosi.postinst.chroot script is bound explicitly, and keeping BuildSources
# empty lets the workspace/cache stay under images/.cache (mkosi rejects a
# workspace inside a configured build source).
BuildSources=

[Content]
Bootable=no
WithDocs=no
WithRecommends=no

# mkosi uses the host apt; the guest still needs apt-get (postinst cleanup
# and later use).
Packages=
        apt
        bash
        build-essential
        busybox-static
        ca-certificates
        cloud-guest-utils
        coreutils
        cpio
        curl
        dbus
        e2fsprogs
        findutils
        fuse-overlayfs
        git
        grep
        gzip
        initramfs-tools
        iproute2
        iputils-ping
        jq
        kmod
        less
        libc-bin
        linux-image-generic
        make
        mawk
        nano
        netbase
        openssh-client
        openssh-server
        openssh-sftp-server
        passwd
        passt
        podman
        procps
        sed
        slirp4netns
        sudo
        systemd
        systemd-resolved
        systemd-sysv
        systemd-timesyncd
        tar
        tzdata
        udev
        uidmap
        util-linux
        xz-utils
        zstd
