- name: Validate the PostgreSQL inputs
  ansible.builtin.import_tasks: validate.yml

- name: Install PostgreSQL and psycopg {{ postgres_version }}
  ansible.builtin.apt:
    name: "{{ postgres_packages }}"
    state: present

- name: Read the cluster configuration
  ansible.builtin.stat:
    path: "{{ postgres_config_dir }}/postgresql.conf"
  register: postgres_cluster_conf

# The package creates the cluster. This role never initializes or replaces
# one, so a missing cluster is a configuration error, not something to fix.
- name: Preview a host without a cluster
  ansible.builtin.meta: end_role
  when: ansible_check_mode and not postgres_cluster_conf.stat.exists

- name: The cluster must already exist
  ansible.builtin.assert:
    that: postgres_cluster_conf.stat.exists
    fail_msg: >-
      no PostgreSQL cluster {{ postgres_version }}/{{ postgres_cluster }} at
      {{ postgres_config_dir }}. Create it with pg_createcluster; this role
      never runs initdb or replaces an existing cluster.
    quiet: true

- name: Read the cluster drop-in directory
  ansible.builtin.stat:
    path: "{{ postgres_config_dir }}/conf.d"
  register: postgres_confd

- name: The cluster must have a conf.d directory
  ansible.builtin.assert:
    that: postgres_confd.stat.isdir | default(false)
    fail_msg: "{{ postgres_config_dir }}/conf.d is missing; the PostgreSQL package normally creates it"
    quiet: true

- name: Add the bbraft drop-in
  ansible.builtin.import_tasks: config.yml

- name: Run PostgreSQL
  ansible.builtin.systemd_service:
    name: "{{ postgres_service }}"
    enabled: true
    state: started
  when: not ansible_check_mode

# A changed drop-in changes listen_addresses/port, which needs a restart
# before the probe and the user/database tasks can reach the intended cluster.
- name: Apply pending PostgreSQL restarts
  ansible.builtin.meta: flush_handlers

- name: Read the server version from the configured socket and port
  community.postgresql.postgresql_query:
    query: SHOW server_version_num
    login_db: postgres
    login_unix_socket: "{{ postgres_unix_socket }}"
    login_port: "{{ postgres_port | postgres_positive_int }}"
  become: true
  become_user: postgres
  register: postgres_server_version
  changed_when: false
  check_mode: false   # read-only probe, runs in --check too
  when: not ansible_check_mode

- name: PostgreSQL must be 17 or newer
  ansible.builtin.assert:
    that: postgres_server_version.query_result[0].server_version_num | postgres_positive_int >= 170000
    fail_msg: "PostgreSQL server_version_num is {{ postgres_server_version.query_result[0].server_version_num }}, need 170000 or newer"
    quiet: true
  when: not ansible_check_mode

- name: Create the bbraft role and database
  ansible.builtin.import_tasks: database.yml
