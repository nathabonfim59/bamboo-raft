# Fixed test values for the A10 jailed KVM harness units
# (internal/node/jail_kvm_test.go), rendered by kvm-harness-render.yml.
# Documentation addresses only; the throwaway VM's owned network namespaces
# carry them. Per-attempt names are derived in the play.
bbraft_node_server_addr: 127.0.0.1:7701
bbraft_node_network_bridge: bbraft0
hardening_vm_bridge_interfaces: [bbraft0]
bbraft_node_network_prefix: 10.42.0.0/16
bbraft_node_network_gateway: 10.42.0.1
bbraft_node_ssh_ingress_addr: 203.0.113.1
bbraft_node_ssh_ingress_iface: up0
bbraft_node_ssh_port_range: 30000-30010
bbraft_node_token: placeholder-kvm-harness-token
# Auto capacity (0): the node detects the throwaway VM's own CPUs, memory
# and disk (minus the reserve) at ratio 1.0, so the actual main never offers
# more than the host has; an explicit value above detection is refused.
bbraft_node_capacity_vcpus: 0
bbraft_node_capacity_memory_mib: 0
bbraft_node_capacity_disk_gib: 0
bbraft_node_manage_service: false
# Phase 2 object store for the attempts that run Phase 2 conformance (link and
# direct). The role renders the unit's EnvironmentFile=, LoadCredential= and
# BBRAFT_S3_SECRET_ACCESS_KEY_FILE from bbraft_node_s3 exactly as in
# production; these values only have to validate. The harness
# (jail_kvm_infra_test.go, writeS3) writes the real files at the paths the
# rendered unit names: the endpoint is the forwarder it listens on inside the
# node namespace (jailKVMS3Addr) and the key is the test's own Garage key.
kt_s3_attempts: [link, direct]
kt_s3:
  endpoint: http://127.0.0.1:7702
  region: garage
  bucket: bbrafttest
  path_style: true
  access_key_id: placeholder-kvm-harness-key-id
kt_s3_secret_access_key: placeholder-kvm-harness-secret
