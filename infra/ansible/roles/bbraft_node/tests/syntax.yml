# Syntax fixture for the complete role, including tasks/main.yml. Only ever
# invoked with --syntax-check: executing it would install packages, create a
# user, write files and start a service. Local connection and placeholders
# only.
- name: Full-role syntax check for bbraft_node
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars.yml
  vars:
    bbraft_node_binary_src: "{{ playbook_dir }}/fixtures/bbraft-node"
    bbraft_node_manage_service: false
    bbraft_node_require_debian: false
    bbraft_node_require_devices: false
  roles:
    - bbraft_node
