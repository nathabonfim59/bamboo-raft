# Syntax fixture for the complete role, including tasks/main.yml. Only ever
# invoked with --syntax-check: executing it would create a user, write files
# and start a service. Local connection and placeholder values only.
- name: Full-role syntax check for bbraft_server
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars.yml
  vars:
    bbraft_server_binary_src: "{{ playbook_dir }}/fixtures/bbraft-server"
    bbraft_server_master_key_source: "{{ playbook_dir }}/fixtures/master-key"
    bbraft_server_manage_service: false
  roles:
    - bbraft_server
