# --- Install --------------------------------------------------------------

- name: Is Garage installed already?
  ansible.builtin.stat:
    path: /etc/garage
  register: garage_installed

- name: Garage system user
  ansible.builtin.user:
    name: "{{ garage_user }}"
    system: true
    home: /var/lib/garage
    create_home: false
    shell: /usr/sbin/nologin

- name: Garage directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ garage_user }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: /etc/garage, owner: root, mode: "0750" }
    - { path: "{{ garage_secrets_dir }}", owner: "{{ garage_user }}", mode: "0700" }
    - { path: /var/lib/garage, owner: "{{ garage_user }}", mode: "0750" }
    - { path: "{{ garage_meta_dir }}", owner: "{{ garage_user }}", mode: "0750" }
    - { path: "{{ garage_data_dir | dirname }}", owner: "{{ garage_user }}", mode: "0750" }
    - { path: "{{ garage_data_dir }}", owner: "{{ garage_user }}", mode: "0750" }
    - { path: /usr/local/lib/garage, owner: root, mode: "0755" }

# --check creates nothing, so on a first install every later task would fail
# on a missing directory. The preview stops here instead.
- name: First install previews only up to here
  ansible.builtin.debug:
    msg: Garage is not installed yet; --check stops here. Run without --check to install.
  when: ansible_check_mode and not garage_installed.stat.exists

- name: End the preview of a first install
  ansible.builtin.meta: end_role
  when: ansible_check_mode and not garage_installed.stat.exists

- name: Download Garage {{ garage_version }} (checksum pinned)
  ansible.builtin.get_url:
    url: "{{ garage_url }}"
    dest: "/usr/local/lib/garage/garage-{{ garage_version }}"
    checksum: "sha256:{{ garage_sha256 }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart garage

- name: Point /usr/local/bin/garage at this version
  ansible.builtin.file:
    src: "/usr/local/lib/garage/garage-{{ garage_version }}"
    dest: /usr/local/bin/garage
    state: link
  notify: Restart garage

# Generated once on the host. Garage rejects secret files others can read.
- name: Generate Garage secrets
  ansible.builtin.shell: |
    set -eu
    umask 077
    od -An -tx1 -N32 /dev/urandom | tr -d ' \n' > "{{ garage_secrets_dir }}/{{ item }}"
    chown {{ garage_user }}:{{ garage_user }} "{{ garage_secrets_dir }}/{{ item }}"
  args:
    creates: "{{ garage_secrets_dir }}/{{ item }}"
  loop: [rpc_secret, admin_token, metrics_token]
  notify: Restart garage

- name: Garage configuration
  ansible.builtin.template:
    src: garage.toml.j2
    dest: "{{ garage_config }}"
    owner: root
    group: "{{ garage_user }}"
    mode: "0640"
  notify: Restart garage

- name: Garage systemd unit
  ansible.builtin.template:
    src: garage.service.j2
    dest: /etc/systemd/system/garage.service
    owner: root
    group: root
    mode: "0644"
  notify: [Reload systemd, Restart garage]

- name: Run Garage
  ansible.builtin.systemd_service:
    name: garage
    enabled: true
    state: started

- name: Apply pending restarts before configuring the cluster
  ansible.builtin.meta: flush_handlers

- name: Wait for the RPC port
  ansible.builtin.wait_for:
    host: "{{ garage_rpc_bind | split(':') | first }}"
    port: "{{ garage_rpc_bind | split(':') | last | int }}"
    timeout: 60
  when: not ansible_check_mode

# --- Single-node layout ---------------------------------------------------

- name: Read the cluster status
  ansible.builtin.command: garage -c {{ garage_config }} status
  register: garage_status
  changed_when: false
  check_mode: false   # read-only probe; must run in --check too
  when: not ansible_check_mode

# A fresh node is listed as "NO ROLE ASSIGNED" until a layout gives it one.
- name: Give this node a role and apply the layout
  ansible.builtin.shell: |
    set -euo pipefail
    g() { garage -c {{ garage_config }} "$@"; }
    id=$(g node id -q | cut -d@ -f1)
    g layout assign -z {{ garage_zone }} -c {{ garage_capacity }} "$id"
    version=$(g layout show | sed -n 's/.*[Cc]urrent cluster layout version: *\([0-9][0-9]*\).*/\1/p' | head -n1)
    g layout apply --version $(( ${version:-0} + 1 ))
  args:
    executable: /bin/bash
  when:
    - not ansible_check_mode
    - "'NO ROLE ASSIGNED' in garage_status.stdout"

- name: Garage must be healthy
  ansible.builtin.uri:
    url: "http://{{ garage_admin_bind }}/health"
    status_code: 200
  register: garage_health
  retries: 15
  delay: 2
  until: garage_health.status == 200
  when: not ansible_check_mode

# --- Bucket and key for bbraft ---------------------------------------------

- name: Read the bucket
  ansible.builtin.command: garage -c {{ garage_config }} bucket info {{ garage_bucket }}
  register: garage_bucket_info
  changed_when: false
  check_mode: false   # read-only probe; must run in --check too
  failed_when: false

- name: Create the bucket
  ansible.builtin.command: garage -c {{ garage_config }} bucket create {{ garage_bucket }}
  when: garage_bucket_info.rc != 0

- name: Read the access key
  ansible.builtin.command: garage -c {{ garage_config }} key info {{ garage_key_name }}
  register: garage_key_info
  changed_when: false
  check_mode: false   # read-only probe; must run in --check too
  failed_when: false

- name: Create the access key
  ansible.builtin.command: garage -c {{ garage_config }} key create {{ garage_key_name }}
  when: garage_key_info.rc != 0
  no_log: true   # prints the secret

- name: Read the bucket's keys
  ansible.builtin.command: garage -c {{ garage_config }} bucket info {{ garage_bucket }}
  register: garage_bucket_keys
  changed_when: false
  check_mode: false   # read-only probe; must run in --check too
  when: not ansible_check_mode

- name: Allow the key on the bucket
  ansible.builtin.command: >-
    garage -c {{ garage_config }} bucket allow --read --write --owner
    {{ garage_bucket }} --key {{ garage_key_name }}
  when:
    - not ansible_check_mode
    - not (garage_bucket_keys.stdout | regex_search('RWO\s+\S*\s*' ~ garage_key_name, multiline=True))

# --- Credentials for bbraft (host only) -------------------------------------

- name: Read the key's secret
  ansible.builtin.command: garage -c {{ garage_config }} key info {{ garage_key_name }} --show-secret
  register: garage_key_secret
  changed_when: false
  check_mode: false   # read-only probe; must run in --check too
  no_log: true
  when: not ansible_check_mode

- name: bbraft config directory
  ansible.builtin.file:
    path: "{{ garage_credentials_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Write the S3 credentials for bbraft
  ansible.builtin.copy:
    dest: "{{ garage_credentials_file }}"
    owner: root
    group: root
    mode: "0600"
    content: |
      # Managed by bamboo-raft infra/ansible (role garage). Secret; never copy
      # into the repository.
      BBRAFT_S3_ENDPOINT=http://{{ garage_s3_bind }}
      BBRAFT_S3_REGION={{ garage_region }}
      BBRAFT_S3_BUCKET={{ garage_bucket }}
      BBRAFT_S3_PATH_STYLE=true
      BBRAFT_S3_ACCESS_KEY_ID={{ garage_key_secret.stdout | regex_search('Key ID:\s*(\S+)', '\1') | first }}
      BBRAFT_S3_SECRET_ACCESS_KEY={{ garage_key_secret.stdout | regex_search('Secret key:\s*(\S+)', '\1') | first }}
  no_log: true
  when: not ansible_check_mode
