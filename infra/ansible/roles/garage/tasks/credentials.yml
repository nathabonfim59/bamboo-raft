# Credentials for bbraft, host only. Two files keep the secret out of any
# environment file: the non-secret settings go to garage_credentials_file and
# the secret alone goes to garage_secret_file, which a systemd unit reads
# through LoadCredential=. Imported by main.yml and directly by the role-local
# render test, which points both paths at a temporary tree and overrides the
# owners in its own vars file.
#
# Both files are root-owned 0600 on a real host; a rendered unit passes the
# systemd credential copy (0400, owned by the service) to bbraft-node, which
# accepts 0600 or stricter.

- name: Read the key's secret
  ansible.builtin.command:
    argv:
      - "{{ garage_binary }}"
      - -c
      - "{{ garage_config }}"
      - key
      - info
      - "{{ garage_key_name }}"
      - --show-secret
  register: garage_key_secret
  changed_when: false
  check_mode: false   # read-only probe; must run in --check too
  no_log: true
  when: not ansible_check_mode

- name: The key report carries an id and a secret
  ansible.builtin.assert:
    that:
      - garage_key_secret.stdout is search('Key ID:\s*\S+')
      - garage_key_secret.stdout is search('Secret key:\s*\S+')
    fail_msg: >-
      garage key info --show-secret did not report a key id and secret; the
      bucket grant and both credential files were left unchanged
    quiet: true
  no_log: true
  when: not ansible_check_mode

- name: Extract the key id and secret
  ansible.builtin.set_fact:
    garage_key_id: >-
      {{ garage_key_secret.stdout | regex_search('Key ID:\s*(\S+)', '\1') | first }}
    garage_key_secret_value: >-
      {{ garage_key_secret.stdout | regex_search('Secret key:\s*(\S+)', '\1') | first }}
  no_log: true
  when: not ansible_check_mode

- name: bbraft config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ garage_credentials_dir_owner | default('root', true) }}"
    group: "{{ garage_credentials_dir_group | default('root', true) }}"
    mode: "{{ garage_credentials_dir_mode | default('0750', true) }}"
  loop: "{{ [garage_credentials_file | dirname, garage_secret_file | dirname] | unique }}"

- name: Write the non-secret S3 settings for bbraft
  ansible.builtin.copy:
    dest: "{{ garage_credentials_file }}"
    owner: "{{ garage_credentials_owner | default('root', true) }}"
    group: "{{ garage_credentials_group | default('root', true) }}"
    mode: "{{ garage_credentials_mode | default('0600', true) }}"
    content: |
      # Managed by bamboo-raft infra/ansible (role garage). Non-secret settings;
      # the secret is a separate root-only file read through LoadCredential=.
      BBRAFT_S3_ENDPOINT=http://{{ garage_s3_bind }}
      BBRAFT_S3_REGION={{ garage_region }}
      BBRAFT_S3_BUCKET={{ garage_bucket }}
      BBRAFT_S3_PATH_STYLE=true
      BBRAFT_S3_ACCESS_KEY_ID={{ garage_key_id }}
  no_log: true
  when: not ansible_check_mode

- name: Write the S3 secret access key for bbraft
  ansible.builtin.copy:
    dest: "{{ garage_secret_file }}"
    owner: "{{ garage_secret_owner | default('root', true) }}"
    group: "{{ garage_secret_group | default('root', true) }}"
    mode: "{{ garage_secret_mode | default('0600', true) }}"
    content: |
      {{ garage_key_secret_value }}
  no_log: true
  diff: false
  when: not ansible_check_mode
