# Garage: the default S3 object store.
# Single node, replication factor 1. Data on the bulk HDD, metadata on NVMe.

# Official static build. Garage publishes no checksum file, so the SHA-256 is
# pinned here from the official download; get_url refuses anything else.
garage_version: v2.5.0
garage_sha256: 2ff667286217cd73ebcb1c03af993822365000441dfe31a80cb64c5189a9dea8
garage_url: "https://garagehq.deuxfleurs.fr/_releases/{{ garage_version }}/x86_64-unknown-linux-musl/garage"

garage_user: garage
garage_binary: garage
garage_config: /etc/garage/garage.toml
garage_secrets_dir: /etc/garage/secrets
garage_meta_dir: /var/lib/garage/meta        # metadata wants SSD/NVMe
garage_data_dir: /srv/bulk/garage/data       # blocks on the bulk disk

# Bound to loopback until other nodes or the edge need to reach it.
garage_s3_bind: 127.0.0.1:3900
garage_rpc_bind: 127.0.0.1:3901
garage_admin_bind: 127.0.0.1:3903
garage_region: garage

garage_zone: dc1
garage_capacity: 3T

# Bucket and access key that bbraft uses. The key's secret is generated by
# Garage on the host and written only to garage_secret_file. The environment
# file carries the non-secret settings; units read the secret through a
# systemd credential (LoadCredential=), so no secret lies in an EnvironmentFile.
garage_bucket: bbraft
garage_key_name: bbraft
garage_credentials_file: /etc/bbraft/s3.env
garage_secret_file: /etc/bbraft/s3-secret-access-key
