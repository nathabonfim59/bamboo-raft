all:
  children:
    nodes:
      hosts:
        node1:
          ansible_host: 203.0.113.10        # documentation address, replace
          ansible_user: debian
          ansible_become: true
          ansible_ssh_private_key_file: ~/.ssh/your_key_ed25519
    # The host that runs Postgres and bbraft-server.
    control:
      hosts:
        node1:
