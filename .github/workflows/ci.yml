name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Postgres and KVM integration tests skip here (no BBRAFT_TEST_* variables).
      - run: make check

  docs:
    name: Docs
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: npm ci
      # Generates the HTTP and Go API reference from api/*.yaml and the Go source, then builds
      # the site; dead links fail the build.
      - run: npm run docs:build
